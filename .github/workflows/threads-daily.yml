name: Threads scheduled dispatch

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "実行内容"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - validate_week
          - install_week
          - preview
          - dispatch
      slot:
        description: "投稿枠"
        required: true
        default: evening
        type: choice
        options:
          - morning
          - noon
          - evening
      target_date:
        description: "確認日（YYYY-MM-DD、省略時は日本時間の今日）"
        required: false
        type: string
  schedule:
    # 15分ごとに当日分の未投稿枠を確認する。
    # GitHubが1回のscheduleを落としても、次回実行で古い枠から1件だけ回収する。
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: threads-scheduled-dispatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install -r requirements.txt

      - name: Validate before any API request
        run: python -m unittest discover -s tests -v

      - name: Resolve operation and slot
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_DATE: ${{ inputs.target_date }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            operation="dispatch_due"
            slot=""
            target_date=""
          else
            operation="$MANUAL_OPERATION"
            slot="$MANUAL_SLOT"
            target_date="$MANUAL_DATE"
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"

      - name: Verify Threads connection
        if: ${{ steps.route.outputs.operation == 'verify' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_API_VERSION: ${{ vars.THREADS_API_VERSION || 'v1.0' }}
        run: python -m app.cli verify-auth

      - name: Validate weekly package without API
        if: ${{ steps.route.outputs.operation == 'validate_week' }}
        env:
          CONTENT_QUEUE_PATH: data/content_queue.json
        run: python -m app.cli validate-week

      - name: Install GPT-completed week without API
        if: ${{ steps.route.outputs.operation == 'install_week' }}
        env:
          DATABASE_PATH: data/tarot_growth.db
          CONTENT_QUEUE_PATH: data/content_queue.json
        run: python -m app.cli prepare-week

      - name: Preview scheduled content
        if: ${{ steps.route.outputs.operation == 'preview' }}
        env:
          CONTENT_QUEUE_PATH: data/content_queue.json
        run: |
          if [ -n "${{ steps.route.outputs.target_date }}" ]; then
            python -m app.cli preview-slot "${{ steps.route.outputs.slot }}" --date "${{ steps.route.outputs.target_date }}"
          else
            python -m app.cli preview-slot "${{ steps.route.outputs.slot }}"
          fi

      - name: Dispatch scheduled content
        if: ${{ steps.route.outputs.operation == 'dispatch' || steps.route.outputs.operation == 'dispatch_due' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_API_VERSION: ${{ vars.THREADS_API_VERSION || 'v1.0' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
          DATABASE_PATH: data/tarot_growth.db
          CONTENT_QUEUE_PATH: data/content_queue.json
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: |
          if [ "${{ steps.route.outputs.operation }}" = "dispatch_due" ]; then
            python -m app.cli dispatch-due
          elif [ -n "${{ steps.route.outputs.target_date }}" ]; then
            python -m app.cli dispatch "${{ steps.route.outputs.slot }}" --date "${{ steps.route.outputs.target_date }}"
          else
            python -m app.cli dispatch "${{ steps.route.outputs.slot }}"
          fi

      - name: Analyze old posts once each morning
        if: ${{ steps.route.outputs.operation == 'dispatch' && steps.route.outputs.slot == 'morning' && vars.AUTO_ANALYZE == 'true' }}
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_API_VERSION: ${{ vars.THREADS_API_VERSION || 'v1.0' }}
          DATABASE_PATH: data/tarot_growth.db
        run: |
          python -m app.cli analyze
          python -m app.cli export

      - name: Save queue and results
        if: ${{ steps.route.outputs.operation == 'install_week' || steps.route.outputs.operation == 'dispatch' || steps.route.outputs.operation == 'dispatch_due' }}
        run: |
          git config user.name "threads-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ data/content_queue.json data/tarot_growth.db data/post_history.csv data/analysis_report.md
          if ! git diff --cached --quiet; then
            git commit -m "data: record scheduled Threads run"
            git push
          fi
