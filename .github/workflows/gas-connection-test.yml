name: GAS connection test

on:
  workflow_dispatch:
    inputs:
      test_label:
        description: "接続テスト識別子"
        required: false
        type: string

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm Google Apps Script dispatch
        env:
          TEST_LABEL: ${{ inputs.test_label }}
        run: |
          echo "Google Apps ScriptからGitHub Actionsを起動できました。"
          echo "test_label=$TEST_LABEL"
          echo "event_name=${{ github.event_name }}"
          echo "repository=${{ github.repository }}"
          echo "branch=${{ github.ref_name }}"
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
